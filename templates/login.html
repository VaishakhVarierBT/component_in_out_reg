<!DOCTYPE html>

<html>

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Component Register - Login</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>


<body class="login-page">


<div class="login-card">

    <h1>Component Register</h1>

    <p class="login-subtitle">
        In / Out Management System
    </p>


    {% if error %}

    <div class="error-message">
        {{ error }}
    </div>

    {% endif %}


    <form method="POST">

        <label>
            Username
        </label>

        <input
            type="text"
            name="username"
            required
            autofocus
        >


        <label>
            Password
        </label>

        <input
            type="password"
            name="password"
            required
        >


        <button
            type="submit"
            class="login-button"
        >
            Login
        </button>

    </form>


</div>


</body>

</html>
